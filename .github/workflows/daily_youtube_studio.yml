name: Daily Automated YouTube Content Studio

on:
  schedule:
    # Runs automatically every day at 08:00 UTC (1:30 PM IST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional custom topic (leave blank to run the daily trending batch)'
        required: false
        default: ''
      auto_publish:
        description: 'Automatically upload generated PENDING_REVIEW videos to YouTube?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize SQLite database & run video generation pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python database.py
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python worker.py --topic "${{ github.event.inputs.topic }}"
          else
            python worker.py
          fi

      - name: Optional Auto-Publish to YouTube (if checked)
        if: ${{ github.event.inputs.auto_publish == 'true' }}
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -c "
          import database, youtube_client
          for v in database.get_videos_by_status('PENDING_REVIEW'):
              print('Uploading:', v['title'])
              yt_id = youtube_client.upload_video_to_youtube(
                  video_path=v['video_path'],
                  title=v['title'],
                  description=v['description'],
                  tags=v.get('tags_list', []),
              )
              database.update_video_status(v['id'], 'PUBLISHED', youtube_video_id=yt_id)
              print('Published YouTube ID:', yt_id)
          "

      - name: Upload generated MP4 videos as downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-vertical-videos
          path: |
            output/*.mp4
            studio.db
          if-no-files-found: ignore

      - name: Commit updated studio.db and videos back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add studio.db output/*.mp4 || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(studio): add generated video drafts [skip ci]"
            git push
          else
            echo "No database or video changes to commit."
          fi
